<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ကျွန်တော့်ရဲ့မှတ်တမ်း Gallery</title>
    <style>
        body { 
            background: linear-gradient(135deg, #ffb6d9, #ff66cc); 
            font-family: sans-serif; 
            margin: 0; 
            padding: 15px; 
            text-align: center; 
        }
        h2 { color: black; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); margin-bottom: 20px; }

        /* Gallery Grid (တစ်တန်းကို ၃ ပုံစီပြမည်) */
        .gallery-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 8px; 
            max-width: 600px; 
            margin: auto; 
        }
        .gallery-grid img { 
            width: 100%; 
            aspect-ratio: 1 / 1; 
            object-fit: cover; 
            border-radius: 8px; 
            border: 2px solid white;
            cursor: pointer; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* ပုံကြီးချဲ့ကြည့်ရန် Full Screen (Lightbox) */
        #lightbox { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); 
            z-index: 10000; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
        }
        #lightbox img { 
            max-width: 100%; 
            max-height: 80vh; 
            object-fit: contain; 
        }

        .close-btn { 
            position: absolute; top: 20px; right: 20px; 
            font-size: 35px; color: white; cursor: pointer; 
        }
        .controls { margin-top: 30px; display: flex; gap: 20px; }
        .btn { 
            padding: 12px 25px; 
            background: #ff1493; 
            color: white; 
            border: none; 
            border-radius: 25px; 
            font-weight: bold; 
            cursor: pointer; 
        }
    </style>
</head>
<body>

    <h2>📷ကျွန်တော့်ရဲ့မှတ်တမ်း📷 </h2>

    <div class="gallery-grid" id="gallery"></div>

    <div id="lightbox">
        <span class="close-btn" onclick="closeLB()">&times;</span>
        <img id="lbImg" src="">
        <div class="controls">
            <button class="btn" onclick="changeImg(-1)">Back</button>
            <button class="btn" onclick="changeImg(1)">Next</button>
        </div>
    </div>

    <script>
        // ပုံနာမည်များကို zayar1.jpg မှ zayar20.jpg အထိ သတ်မှတ်သည်
        const images = [];
        for (let i = 1; i <= 26; i++) {
            images.push(`images/zayar${i}.jpg`);
        }

        const gallery = document.getElementById('gallery');
        images.forEach((src, index) => {
            const img = document.createElement('img');
            img.src = src;
            img.onerror = function() { this.style.display='none'; }; 
            img.onclick = () => openLB(index);
            gallery.appendChild(img);
        });

        let currentIdx = 0;
        function openLB(index) {
            currentIdx = index;
            document.getElementById('lbImg').src = images[currentIdx];
            document.getElementById('lightbox').style.display = 'flex';
        }

        function closeLB() {
            document.getElementById('lightbox').style.display = 'none';
        }

        function changeImg(step) {
            currentIdx = (currentIdx + step + images.length) % images.length;
            document.getElementById('lbImg').src = images[currentIdx];
        }
    </script>
</body>
</html>
