<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>📱 Mi Gallery (Google Drive) 🖼️</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 0 0 70px 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000000;
      color: white;
    }
    
    /* Header Bar */
    .header {
      position: sticky;
      top: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      z-index: 100;
      padding: 15px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1f1f1f;
    }
    .header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
    }
    .back-btn {
      color: #3b82f6;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    /* Loading Spinner */
    .loading-box {
      padding: 50px 20px;
      font-size: 15px;
      color: #9ca3af;
      text-align: center;
    }

    /* Photo Grid */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      padding: 3px;
    }
    @media (min-width: 600px) {
      .gallery-grid { grid-template-columns: repeat(5, 1fr); }
    }
    .gallery-item {
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #18181b;
      position: relative;
    }
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .gallery-item img:active {
      transform: scale(0.95);
      opacity: 0.8;
    }

    /* Lightbox Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 2000;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #000000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      touch-action: none;
    }
    .modal-header {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
      z-index: 10;
    }
    .counter {
      font-size: 15px;
      font-weight: 500;
      color: #e4e4e7;
    }
    .close-icon {
      font-size: 22px;
      color: #ffffff;
      cursor: pointer;
      padding: 4px 10px;
    }
    .modal-img-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .modal img {
      max-width: 100%;
      max-height: 90vh;
      object-fit: contain;
      transition: transform 0.15s ease-out;
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 60px;
      background: rgba(18, 18, 18, 0.9);
      backdrop-filter: blur(15px);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #27272a;
      z-index: 100;
    }
    .nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #71717a;
      font-size: 11px;
      gap: 3px;
    }
    .nav-tab.active { color: #3b82f6; }
    .nav-tab svg { width: 22px; height: 22px; fill: currentColor; }
  </style>
</head>
<body>

  <!-- Top Header -->
  <div class="header">
    <a href="index.html" class="back-btn" onclick="logPageExit('Back Button')">⬅ ပြန်ထွက်မည်</a>
    <h1 id="pageTitle">အမှတ်တရများ ရယူနေသည်...</h1>
    <span style="width: 50px;"></span>
  </div>

  <!-- Loading State -->
  <div class="loading-box" id="loadingBox">
    ⏳ Google Drive မှ ပုံများ ရယူနေပါသည်။ ခဏစောင့်ပေးပါ...
  </div>

  <!-- Gallery Grid -->
  <div class="gallery-grid" id="galleryGrid"></div>

  <!-- Fullscreen Modal View -->
  <div class="modal" id="imageModal">
    <div class="modal-header">
      <div class="counter" id="imageCounter">1 / 1</div>
      <div class="close-icon" onclick="closeImageModal()">✕</div>
    </div>
    <div class="modal-img-container" id="swipeArea">
      <img id="modalImg" src="" alt="Gallery Image">
    </div>
  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <div class="nav-tab active">
      <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
      <span>ဓာတ်ပုံများ</span>
    </div>
    <div class="nav-tab">
      <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
      <span>အယ်လ်ဘမ်</span>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // ⚙️ TELEGRAM CONFIGURATION (ဒီနေရာတွင် မိမိ Bot Token နှင့် Chat ID ထည့်ပါ)
    // -------------------------------------------------------------
    const TELEGRAM_BOT_TOKEN = "8628160117:AAG4gTny0so1evSYkBPFM6DCgAz1kNDzKVI"; // ဥပမာ - 123456789:ABCdefGhIJKlmNoPQ...
    const TELEGRAM_CHAT_ID = "5769718406";     // ဥပမာ - 987654321 သို့မဟုတ် -100xxx

    // Google Apps Script Web App URL
    const SCRIPT_URL = "Https://script.google.com/macros/s/AKfycbw8PWNsxBRfffpZI0yF_skxw1UmdIMcyfQrNxZxNmoNhlUIHp2_ar7Yy5WZCv-jBZMe/exec";

    let imageUrls = [];
    let currentIndex = 0;

    const grid = document.getElementById("galleryGrid");
    const modal = document.getElementById("imageModal");
    const modalImg = document.getElementById("modalImg");
    const counter = document.getElementById("imageCounter");
    const swipeArea = document.getElementById("swipeArea");
    const loadingBox = document.getElementById("loadingBox");
    const pageTitle = document.getElementById("pageTitle");

    // 📩 Telegram Message ပေးပို့သည့် Function
    function sendTelegramMessage(text) {
      if (!TELEGRAM_BOT_TOKEN || TELEGRAM_BOT_TOKEN === "YOUR_TELEGRAM_BOT_TOKEN_HERE") return;
      
      const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
      fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          chat_id: TELEGRAM_CHAT_ID,
          text: text,
          parse_mode: "HTML"
        }),
        keepalive: true
      }).catch(err => console.error("Telegram Notification Error:", err));
    }

    // 🚀 ၁။ ဝင်ရောက်သည့် စာရင်း လျှို့ဝှက်ပေးပို့ခြင်း (Page Enter)
    window.addEventListener("DOMContentLoaded", () => {
      const timeStr = new Date().toLocaleString();
      sendTelegramMessage(`🟢 <b>[Gallery Access Log]</b>\n👤 အသုံးပြုသူ Gallery သို့ ဝင်ရောက်လာပါပြီ။\n⏰ အချိန်: ${timeStr}`);
    });

    // 🚪 ၂။ ထွက်ခွာသည့် စာရင်း ပေးပို့ခြင်း (Page Exit)
    let hasLoggedExit = false;
    function logPageExit(reason = "Page Closed/Left") {
      if (!hasLoggedExit) {
        hasLoggedExit = true;
        const timeStr = new Date().toLocaleString();
        sendTelegramMessage(`🔴 <b>[Gallery Exit Log]</b>\n🚪 အသုံးပြုသူ Gallery မှ ထွက်ခွာသွားပါပြီ။\n📌 အကြောင်းအရာ: ${reason}\n⏰ အချိန်: ${timeStr}`);
      }
    }

    window.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") {
        logPageExit("App Minimized or Tab Switched");
      }
    });

    // Google Drive Folder မှ ပုံများကို အလိုအလျောက် ရယူခြင်း
    fetch(SCRIPT_URL)
      .then(response => response.json())
      .then(data => {
        imageUrls = data;
        loadingBox.style.display = "none";
        pageTitle.innerText = `အမှတ်တရများ (${imageUrls.length})`;
        renderGallery();
      })
      .catch(error => {
        console.error("Error loading images:", error);
        loadingBox.innerText = "❌ ပုံများ ရယူရာတွင် အမှားအယွင်း ရှိနေပါသည်။ Google Script Link ကို ပြန်လည်စစ်ဆေးပါ။";
      });

    // Grid Rendering
    function renderGallery() {
      grid.innerHTML = "";
      imageUrls.forEach((url, index) => {
        const item = document.createElement("div");
        item.className = "gallery-item";
        item.innerHTML = `<img src="${url}" loading="lazy" onclick="openImageModal(${index})">`;
        grid.appendChild(item);
      });
    }

    // 🖼️ ၃။ ပုံများ နှိပ်ကြည့်သည့် စာရင်း ပေးပို့ခြင်း (Photo View Log)
    function openImageModal(index) {
      currentIndex = index;
      resetZoom();
      updateModalImage();
      modal.style.display = "flex";

      // Telegram သို့ မည်သည့်ပုံ ကြည့်သည်ကို သတင်းပို့ခြင်း
      sendTelegramMessage(`🖼️ <b>[Photo View Log]</b>\n📸 ပုံနံပါတ် <b>(${index + 1} / ${imageUrls.length})</b> ကို ဖွင့်ကြည့်နေပါသည်။`);
    }

    function closeImageModal() {
      resetZoom();
      modal.style.display = "none";
    }

    function updateModalImage() {
      modalImg.src = imageUrls[currentIndex];
      counter.innerText = `${currentIndex + 1} / ${imageUrls.length}`;
      resetZoom();
    }

    // Touch Pinch-to-Zoom, Pan & Swipe Logic
    let currentScale = 1;
    let startDistance = 0;
    let initialScale = 1;
    let posX = 0, posY = 0;
    let startX = 0, startY = 0;
    let isDragging = false;
    let touchStartX = 0, touchStartY = 0;
    let touchEndX = 0, touchEndY = 0;
    let lastTapTime = 0;

    function resetZoom() {
      currentScale = 1;
      posX = 0; posY = 0;
      applyTransform();
    }

    function applyTransform() {
      modalImg.style.transform = `translate(${posX}px, ${posY}px) scale(${currentScale})`;
    }

    function getDistance(touches) {
      return Math.hypot(
        touches[0].pageX - touches[1].pageX,
        touches[0].pageY - touches[1].pageY
      );
    }

    swipeArea.addEventListener("touchstart", (e) => {
      if (e.touches.length === 2) {
        startDistance = getDistance(e.touches);
        initialScale = currentScale;
        return;
      }
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].pageX;
        touchStartY = e.touches[0].pageY;
        if (currentScale > 1) {
          isDragging = true;
          startX = touchStartX - posX;
          startY = touchStartY - posY;
        }
        const currentTime = new Date().getTime();
        if (currentTime - lastTapTime < 300 && currentTime - lastTapTime > 0) {
          if (currentScale > 1) resetZoom();
          else { currentScale = 2.5; applyTransform(); }
          e.preventDefault();
        }
        lastTapTime = currentTime;
      }
    }, { passive: false });

    swipeArea.addEventListener("touchmove", (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const currentDistance = getDistance(e.touches);
        if (startDistance > 0) {
          const scaleChange = currentDistance / startDistance;
          currentScale = Math.min(Math.max(1, initialScale * scaleChange), 4);
          applyTransform();
        }
        return;
      }
      if (e.touches.length === 1 && isDragging && currentScale > 1) {
        e.preventDefault();
        posX = e.touches[0].pageX - startX;
        posY = e.touches[0].pageY - startY;
        applyTransform();
      }
    }, { passive: false });

    swipeArea.addEventListener("touchend", (e) => {
      isDragging = false;
      if (currentScale === 1 && e.changedTouches.length === 1) {
        touchEndX = e.changedTouches[0].pageX;
        touchEndY = e.changedTouches[0].pageY;
        const deltaX = touchEndX - touchStartX;
        const deltaY = touchEndY - touchStartY;
        
        if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 50) {
          if (deltaX < 0) {
            currentIndex = (currentIndex + 1) % imageUrls.length;
            updateModalImage();
          } else {
            currentIndex = (currentIndex - 1 + imageUrls.length) % imageUrls.length;
            updateModalImage();
          }
        } else if (deltaY > 120) {
          closeImageModal();
        }
      }
    });
  </script>
</body>
</html>
